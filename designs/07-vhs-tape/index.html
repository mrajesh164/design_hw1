<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCENE &amp; SIP VIDEO — Now Renting</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre, shown as a 1980s video rental store where every genre is a VHS tape.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <div class="track" aria-hidden="true"></div>

  <header class="tv" aria-label="Welcome">
    <div class="screen">
      <p class="osd tl"><button id="play" class="play" type="button" aria-label="Play all tapes, one after another">&#9654; PLAY</button></p>
      <p class="osd tr">SP <span id="counter">0:00:00</span></p>
      <h1 class="glitch" data-text="SCENE &amp; SIP VIDEO">SCENE &amp; SIP VIDEO</h1>
      <p class="tagline">Every drink is a genre.<br>Pick a tape, any tape.</p>
      <a class="select" href="#shop">SELECT A TAPE <span class="arrow">&#9660;</span></a>
      <p class="osd bl" id="clock">&nbsp;</p>
      <p class="osd br" id="open-state">&nbsp;</p>
    </div>
  </header>

  <main class="shop" id="shop">
    <div class="sign">
      <h2>New Releases</h2>
      <p>Pick a tape and flip it over to read the back of the box.</p>
    </div>
    <div class="shelf" id="shelf"></div>
  </main>

  <footer class="foot">
    <div class="late">
      <b>STORE INFO</b>
      <p>1138 Marquee Lane, Hyde Park, Chicago</p>
      <p>Open daily, 7 a.m. to 10 p.m.</p>
    </div>
  </footer>

  <a class="back" href="../../index.html">&larr; Now Showing gallery</a>
  <script src="script.js"></script>
</body>
</html>
