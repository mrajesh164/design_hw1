<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCENE &amp; SIP — Eight Genres</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre, told through one name that changes shape as you turn a genre dial.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bgfx" aria-hidden="true">
    <div class="fx rest"></div><div class="fx horror"></div><div class="fx scifi"></div><div class="fx noir"></div><div class="fx romance"></div><div class="fx western"></div><div class="fx mystery"></div><div class="fx fantasy"></div><div class="fx comedy"></div>
  </div>
  <header class="top">
    <p class="kicker">A café in eight genres</p>
    <div class="stage" id="stage">
      <h1 id="word" aria-label="Scene &amp; Sip"><span class="letters" id="letters" aria-hidden="true"></span></h1>
    </div>
    <p class="instruction"><span aria-hidden="true">&#8595;</span> Turn the dial to change the genre <span aria-hidden="true">&#8595;</span></p>
  </header>

  <main>
    <section class="dial-card" aria-labelledby="dial-label">
      <div class="dial-head">
        <label id="dial-label" for="dial">Genre</label>
        <output id="readout" for="dial">Rest</output>
      </div>

      <input type="range" id="dial" min="-100" max="700" step="1" value="-100" aria-label="Genre">
      <div class="marks" aria-hidden="true" id="marks"></div>

      <div class="pills" id="pills" role="group" aria-label="Choose a genre"></div>

      <div class="steps">
        <button type="button" id="prev">&larr; Previous genre</button>
        <button type="button" id="next">Next genre &rarr;</button>
        <button type="button" id="rest" class="quiet">Back to rest</button>
        <button type="button" id="wobble" class="quiet" aria-pressed="true">Wobble: on</button>
      </div>
    </section>

    <section class="menu" id="menu" aria-live="polite" aria-label="Menu for the chosen genre"></section>
  </main>

  <footer class="foot">
    <p>1138 Marquee Lane, Chicago, IL 60615</p>
    <p>Open daily, 7 a.m. to 10 p.m.</p>
  </footer>

  <a class="back" href="../../index.html">&larr; Now Showing gallery</a>
  <script src="script.js"></script>
</body>
</html>
