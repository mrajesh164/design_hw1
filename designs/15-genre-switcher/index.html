  <title>Scene &amp; Sip — One Café, Eight Genres</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre. Pick a genre and the whole page changes its look: eight complete skins for one menu.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-genre="noir">
  <nav class="switcher" aria-label="Choose a genre">
    <p class="switch-label">Pick a genre, change the whole café</p>
    <div class="switch-btns" id="switch-btns" role="group" aria-label="Genres"></div>
    <p class="switch-hint">Tip: use the &larr; &rarr; arrow keys</p>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <main class="stage" id="stage">

    </noscript>
  </main>

  <footer class="foot">
    <p>1138 Marquee Lane, Hyde Park, Chicago</p>
