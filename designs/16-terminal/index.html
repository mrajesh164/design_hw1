<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene &amp; Sip: scene-and-sip ~/menu</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre, as a terminal you can type into or click through.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="term" aria-label="Scene and Sip terminal">
      <header class="bar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1 class="title">scene-and-sip: ~/menu</h1>
        <span class="bar-hint">Press Enter to run</span>
      </header>

      <div class="log" id="log" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></div>

      <div class="dock">
        <div class="chips" role="group" aria-label="Suggested commands">
          <span class="chip-label">Commands</span>
          <div class="chip-row" id="chips-cmd"></div>
        </div>
        <div class="chips" role="group" aria-label="Genres">
          <span class="chip-label">Genres</span>
          <div class="chip-row" id="chips-genre"></div>
        </div>

        <form class="entry" id="entry" autocomplete="off">
          <label class="lbl" for="cmd">Command</label>
          <div class="field">
            <span class="prompt" aria-hidden="true">$</span>
            <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="try: menu, horror, or order true grit">
            <button type="submit" class="run">Run</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="foot">
      <p>1138 Marquee Lane, Hyde Park, Chicago &nbsp;&middot;&nbsp; Open daily, 7 a.m. to 10 p.m.</p>
    </footer>
  </main>
