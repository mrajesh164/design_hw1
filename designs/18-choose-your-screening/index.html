<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Scene &amp; Sip — Choose Your Screening</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre. Answer a few story questions and find the genre, and the drink, that fits your mood.">
  <link rel="stylesheet" href="style.css">
</head>
<body data-path="start" data-end="">
  <div class="deco" aria-hidden="true"></div>
  <div class="deco2" aria-hidden="true"></div>

  <header class="bar">
    <p class="brand">Scene &amp; Sip</p>
    <nav class="crumbs" aria-label="Your choices so far"><ol id="crumbs"></ol></nav>
    <button type="button" class="menu-link" id="bar-menu">Whole menu</button>

  <main class="stage">
    <section class="screen" id="screen" aria-live="off">
      <noscript>
        <h1>Choose your screening</h1>
        <p>This page is a short story that needs JavaScript. The menu: Horror: The Final Girl $4.00, Basement Cold Brew $5.00, The Call Is Coming From Inside $5.50. Sci-Fi: Warp Drive $6.00, First Contact $6.50, Replicant $5.25. Noir: Bitter End $5.00, The Long Goodbye $4.50, Femme Fatale $4.75. Romance: Meet Cute $8.00, Rainstorm Kiss $5.75, The Grand Gesture $6.25. Action: Full Throttle $3.75, Mission: Espresso $4.25. Mystery: The Usual Suspect $4.25, Red Herring $5.50, Plot Twist $6.00. Fantasy: The Chosen One $6.50, Dragon's Breath $5.75, Elixir of Life $6.25. Comedy: Slapstick $4.50, Punchline $5.25, Laugh Track $5.00.</p>
      </noscript>
    </section>
  </main>

  <footer class="foot">
    <p>1138 Marquee Lane, Chicago, IL 60615</p>
    <p>Open daily, 7 a.m. to 10 p.m.</p>
  </footer>

  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <div class="dlg-head">
      <h2 id="menu-title" tabindex="-1">The whole menu</h2>
      <button type="button" class="dlg-close" id="menu-close">Close</button>
    </div>
    <div id="menu-body"></div>
  </dialog>

  <a class="back" href="../../index.html">&larr; Now Showing gallery</a>
  <script src="script.js"></script>
</body>
</html>
