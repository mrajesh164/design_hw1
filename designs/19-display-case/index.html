<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene &amp; Sip — The Display Case</title>
  <meta name="description" content="Scene &amp; Sip, a café whose menu is organized by film genre, shown as the lit glass display case outside a cinema with a shelf for every genre.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="how">Move across the glass to light each shelf. Click a drink to read about it.</p>

  <main class="wrap">
    <div class="cabinet" id="cabinet">
      <header class="board">
        <span class="bulbs top" aria-hidden="true"></span>
        <h1>Scene &amp; Sip</h1>
        <span class="bulbs bottom" aria-hidden="true"></span>
      </header>

      <div class="glass" id="glass">
        <div class="bays" id="bays">
          <noscript>
            <p class="plain">The display case needs JavaScript. The menu: Horror: The Final Girl $4.00, Basement Cold Brew $5.00, The Call Is Coming From Inside $5.50. Sci-Fi: Warp Drive $6.00, First Contact $6.50, Replicant $5.25. Noir: Bitter End $5.00, The Long Goodbye $4.50, Femme Fatale $4.75. Romance: Meet Cute $8.00, Rainstorm Kiss $5.75, The Grand Gesture $6.25. Western: True Grit $3.75, A Fistful of Espresso $4.25. Mystery: The Usual Suspect $4.25, Red Herring $5.50, Plot Twist $6.00. Fantasy: The Chosen One $6.50, Dragon's Breath $5.75, Elixir of Life $6.25. Comedy: Slapstick $4.50, Punchline $5.25, Laugh Track $5.00.</p>
          </noscript>
        </div>
        <span class="glare" aria-hidden="true"></span>
        <span class="light" aria-hidden="true"></span>
      </div>
      <div class="plinth" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="foot">
    <p>1138 Marquee Lane, Chicago, IL 60615</p>
    <p>Open daily, 7 a.m. to 10 p.m.</p>
  </footer>

  <dialog id="card" aria-labelledby="c-name">
    <div class="c-inner" id="c-inner">
      <div class="c-art" id="c-art"></div>
      <div class="c-body">
        <p class="c-genre" id="c-genre"></p>
        <h2 id="c-name"></h2>
        <p class="c-price" id="c-price"></p>
        <p class="c-desc" id="c-desc"></p>
      </div>
      <button type="button" class="c-close" id="c-close">Close</button>
    </div>
  </dialog>

  <a class="back" href="../../index.html">&larr; Now Showing gallery</a>
  <script src="art.js"></script>
  <script src="script.js"></script>
</body>
</html>
