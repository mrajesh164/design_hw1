        <p>Your friendly neighborhood café. Coffee, tea, and a good story in every cup.</p>
        <p>This page works like a disc menu and needs JavaScript. About us: Scene &amp; Sip is a small neighborhood café in Hyde Park built around a simple idea: a menu you can browse like a movie night. Every drink lives in one of eight film genres.</p>
        <p>The menu: Horror: The Final Girl $4.00, Basement Cold Brew $5.00, The Call Is Coming From Inside $5.50. Sci-Fi: Warp Drive $6.00, First Contact $6.50, Replicant $5.25. Noir: Bitter End $5.00, The Long Goodbye $4.50, Femme Fatale $4.75. Romance: Meet Cute $8.00, Rainstorm Kiss $5.75, The Grand Gesture $6.25. Action: Full Throttle $3.75, Mission: Espresso $4.25. Mystery: The Usual Suspect $4.25, Red Herring $5.50, Plot Twist $6.00. Fantasy: The Chosen One $6.50, Dragon's Breath $5.75, Elixir of Life $6.25. Comedy: Slapstick $4.50, Punchline $5.25, Laugh Track $5.00.</p>
        <p>Visit us: 1138 Marquee Lane, Chicago, IL 60615. Open daily, 7 a.m. to 10 p.m. Call ahead: (555) 019-0420.</p>
