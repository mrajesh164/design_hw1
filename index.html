<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now Showing — 25 Landing Pages for a Genre Café</title>
  <meta name="description" content="Twenty-five landing pages for a fictional café whose menu is built around film and TV genres, and the story of how they were explored, combined and refined.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <h1 class="title">
      <span class="num">25</span>
      <span class="h1-sub">landing pages for a café whose menu is organized by film and TV genre.</span>
      <svg class="cup" viewBox="0 0 96 64" role="img" aria-label="A steaming coffee bowl">
        <path class="steam" d="M34 20c-4-4 4-7 0-12M46 20c-4-4 4-7 0-12M58 20c-4-4 4-7 0-12"/>
        <path class="mug" d="M10 28h66a33 22 0 0 1-33 26h0a33 22 0 0 1-33-26z"/>
        <path class="mug" d="M76 32h5a6 6 0 0 1 0 12h-9"/>
        <path d="M30 58h26"/>
      </svg>
    </h1>
  </header>

  <nav class="tabs" role="tablist" aria-label="Gallery sections">
    <button type="button" role="tab" id="tab-all" aria-controls="panel-all" aria-selected="true" data-tab="all">All 25</button>
    <button type="button" role="tab" id="tab-journey" aria-controls="panel-journey" aria-selected="false" tabindex="-1" data-tab="journey">Journey</button>
    <button type="button" role="tab" id="tab-decisions" aria-controls="panel-decisions" aria-selected="false" tabindex="-1" data-tab="decisions">Decisions</button>
    <button type="button" role="tab" id="tab-tree" aria-controls="panel-tree" aria-selected="false" tabindex="-1" data-tab="tree">Family tree</button>
  </nav>

  <main>
    <section id="panel-all" class="panel" role="tabpanel" aria-labelledby="tab-all">
      <div id="journal" class="journal"></div>
    </section>
    <section id="panel-journey" class="panel" role="tabpanel" aria-labelledby="tab-journey" hidden>
      <div id="journey-body" class="story"></div>
    </section>
    <section id="panel-tree" class="panel" role="tabpanel" aria-labelledby="tab-tree" hidden>
      <div id="tree-body" class="story"></div>
    </section>
    <section id="panel-decisions" class="panel" role="tabpanel" aria-labelledby="tab-decisions" hidden>
      <div id="decisions-body" class="story"></div>
    </section>
  </main>


  <script src="js/entries.js"></script>
  <script src="js/story.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
